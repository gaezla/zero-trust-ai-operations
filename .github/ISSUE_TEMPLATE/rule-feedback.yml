name: Feedback on a rule or requirement
description: A rule or requirement is wrong, unclear, untestable or missing something.
title: "[Rule] "
labels: ["rule"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping sharpen the rules. Evidence a reader can check (a standard, a documented incident, a published design) makes a proposal mergeable.
  - type: dropdown
    id: rule
    attributes:
      label: Which rule?
      options:
        - "1. Act only as the person who asked"
        - "2. Never give the AI a credential"
        - "3. Give the AI no network of its own"
        - "4. Let only a person approve a change, exactly as it will run"
        - "5. Record every decision where the AI cannot change it"
        - "General requirements (R0)"
        - "Threat model, terminology or scope"
        - "Residual risk"
        - "A rule or requirement that is missing"
    validations:
      required: true
  - type: input
    id: requirement
    attributes:
      label: Requirement ID
      description: For example R4.3. Leave empty if the feedback is about a whole rule.
      placeholder: "R4.3"
  - type: textarea
    id: change
    attributes:
      label: What should change?
      description: Quote the current wording and propose the new wording.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links to the standard, incident, design or other source that supports the change.
    validations:
      required: true
  - type: checkboxes
    id: neutral
    attributes:
      label: Vendor-neutral
      options:
        - label: This proposal names no product and promotes none.
          required: true
